<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de costos | D&amp;G Multiservicios</title>
<style>
:root{color-scheme:dark;--blue:#11294e;--gold:#ebb252;--white:#faf8f1;--muted:#b8c7da;--navy:#091527}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1c3c65,var(--navy) 66%);min-height:100vh;font:16px system-ui,sans-serif;color:var(--white);padding:20px 14px}
main{max-width:440px;margin:auto}
header{text-align:center;margin:2px 0 18px}
.brand{color:var(--gold);font-size:.78rem;letter-spacing:.17em;font-weight:750}
h1{font-size:clamp(1.65rem,6vw,2.15rem);margin:5px 0 0;letter-spacing:-.045em}
.calculator{padding:16px;border:1px solid #395171;border-radius:23px;background:#132744;box-shadow:0 18px 55px #0005}
.display{background:#080f1d;border:1px solid #3a4a60;border-radius:14px;padding:12px 14px;text-align:right}
.display label{display:block;color:var(--muted);font-size:.83rem}
.display input{width:100%;border:0;background:transparent;color:var(--gold);font:700 2rem ui-monospace,monospace;text-align:right;padding:5px 0}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:2px}
.fields{display:grid;gap:6px;margin:12px 0}
.fields button{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-size:.9rem;padding:9px 11px;background:#0c1e38;font-weight:500}
.fields button[aria-pressed=true]{border-color:var(--gold)}
.fields b{color:var(--gold);white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{color:var(--white);background:#214269;border:1px solid #476384;border-radius:10px;cursor:pointer;min-height:41px;font:inherit;font-weight:650;touch-action:manipulation}
button:hover{filter:brightness(1.15)}
.action{grid-column:1/-1;background:var(--gold);color:#181007;border-color:var(--gold);min-height:45px;margin-top:2px}
.utility{display:flex;justify-content:space-between;margin:9px 0 2px}
.utility button{background:transparent;color:var(--muted);border:0;min-height:35px;font-size:.84rem;padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.result{background:#080f1d;padding:12px;border-radius:12px;margin:5px 0 0}
.result p{display:flex;justify-content:space-between;gap:8px;margin:5px 0;font-size:.9rem}
.result output{font-weight:750;color:var(--gold);font-variant-numeric:tabular-nums}
#error{margin:7px 0 0;color:#ffc6b7;font-size:.86rem}
footer{text-align:center;margin-top:16px;color:var(--muted);font-size:.86rem}
footer a{color:var(--gold);font-weight:750;text-underline-offset:3px}
</style>
<main>
<header><a href="./" style="color:var(--muted);display:inline-block;margin-bottom:10px">← Volver a D&amp;G</a><div class="brand">D&amp;G MULTISERVICIOS</div><h1>¿Cuánto me cuesta el pedido?</h1></header>
<section class="calculator" aria-label="Calculadora gratuita">
<div class="display"><label id="screen-label" for="screen">Cantidad de unidades</label><input id="screen" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="0"></div>
<div class="fields" aria-label="Datos del pedido">
<button type="button" data-field="0" aria-pressed="true"><span>Cantidad de unidades</span><b>—</b></button>
<button type="button" data-field="1" aria-pressed="false"><span>Costo por unidad, incluido tu tiempo</span><b>—</b></button>
<button type="button" data-field="2" aria-pressed="false"><span>Entrega y otros costos del pedido</span><b>—</b></button>
</div>
<div class="keys" aria-label="Teclado de la calculadora"></div>
<div class="utility"><button type="button" id="demo">Probar con 10 camisetas</button><button type="button" id="clear">Borrar todo</button></div>
<div class="result" aria-live="polite"><p>Costo total del pedido <output id="total">—</output></p><p>Costo por unidad con entrega <output id="unit">—</output></p></div>
<p id="error" role="alert" hidden></p>
</section>
<footer>¿Quieres saber cuánto cobrar y qué ofertas te conviene aceptar?<br><a href="descargables.html#me-conviene">Ver ¿ME CONVIENE? completo · B/.9.99</a></footer>
</main>
<script>
const values=['','',''];
let active=0;
const screen=document.querySelector('#screen');
const fields=[...document.querySelectorAll('[data-field]')];
const label=document.querySelector('#screen-label');
const total=document.querySelector('#total');
const unit=document.querySelector('#unit');
const error=document.querySelector('#error');
const format=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(value){return 'B/. '+format.format(value)}
function parse(value){return Number(value.replace(',','.'))}
function cents(value){const [whole,decimal='']=value.replace(',','.').split('.');return Number(whole)*100+Number(decimal.padEnd(2,'0'))}
function display(){
  screen.value=values[active];
  label.textContent=fields[active].querySelector('span').textContent;
  screen.inputMode=active===0?'numeric':'decimal';
  fields.forEach((button,index)=>{
    button.setAttribute('aria-pressed',index===active);
    const value=values[index];
    button.querySelector('b').textContent=value&&Number.isFinite(parse(value))?(index===0?value:money(parse(value))):'—';
  });
}
function setValue(value){
  const allowed=active===0?/^\d{0,6}$/:/^\d{0,7}([.,]\d{0,2})?$/;
  if(allowed.test(value)) values[active]=value;
  error.hidden=true;
  total.value=unit.value='—';
  display();
}
function select(index){active=index;display()}
function calculate(){
  const quantity=parse(values[0]);
  if(quantity<1||!values[1]||!Number.isFinite(parse(values[1]))||(values[2]&&!Number.isFinite(parse(values[2])))){
    error.textContent='Ingresa al menos una unidad y un costo por unidad válido. Si no tienes otros gastos, puedes dejar ese campo vacío.';
    error.hidden=false;
    select(quantity<1?0:(!values[1]||!Number.isFinite(parse(values[1]))?1:2));
    return;
  }
  const cost=quantity*cents(values[1])+cents(values[2]);
  total.value=money(cost/100);
  unit.value=money(cost/quantity/100);
  error.hidden=true;
}
fields.forEach((button,index)=>button.addEventListener('click',()=>select(index)));
screen.addEventListener('input',()=>setValue(screen.value));
screen.addEventListener('keydown',event=>{if(event.key==='Enter')calculate()});
const keys=document.querySelector('.keys');
for(const key of ['7','8','9','4','5','6','1','2','3','.','0','⌫','Calcular costo']){
  const button=document.createElement('button');
  button.type='button';
  button.textContent=key;
  if(key==='⌫')button.setAttribute('aria-label','Borrar último carácter');
  if(key==='Calcular costo')button.className='action';
  button.addEventListener('click',()=>{
    if(key==='Calcular costo')calculate();
    else if(key==='⌫')setValue(values[active].slice(0,-1));
    else setValue(values[active]+key);
  });
  keys.append(button);
}
document.querySelector('#clear').addEventListener('click',()=>{values.fill('');select(0);setValue('')});
document.querySelector('#demo').addEventListener('click',()=>{values.splice(0,3,'10','8','10');select(0);calculate()});
display();
</script>
</html>
